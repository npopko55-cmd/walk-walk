      --cream-faint: rgba(255, 248, 237, 0.15);

    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      height: 100%;
      background: var(--red);
      color: var(--cream);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;

    body {

        radial-gradient(circle at 85% 90%, rgba(255, 90, 30, 0.22) 0%, transparent 55%),

      display: flex; flex-direction: column;
      align-items: center; justify-content: space-between;
      padding: 32px 24px;
      text-align: center;

      flex: 1;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 28px;
      max-width: 360px;
    }

    .spinner {
      width: 56px; height: 56px;
      position: relative;
    }
    .spinner::before {
      content: '';
      position: absolute; inset: 0;
      border: 3px solid var(--cream-faint);
      border-radius: 50%;
    }
    .spinner::after {
      content: '';
      position: absolute; inset: 0;
      border: 3px solid transparent;
      border-top-color: var(--cream);
      border-right-color: var(--cream);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    h1 {
      font-family: 'Unbounded', sans-serif;
      font-weight: 700;
      font-size: 26px;
      line-height: 1.15;
      letter-spacing: -0.02em;
      margin: 0;
      color: var(--cream);
    }
    .sub {
      font-size: 15px;
      line-height: 1.5;
      color: var(--cream-soft);
      margin: 0;
    }

    .bottom {
      width: 100%;
      max-width: 360px;
      padding-bottom: 8px;
    }
    .manual-wrap {
      font-size: 13px;
      color: var(--cream-soft);

    .manual-wrap a {
      display: inline-block;
      margin-top: 10px;

      background: var(--cream);
      color: var(--red-deep);
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 14px;
      text-decoration: none;
      border-radius: 999px;
      transition: transform 0.15s ease, background 0.15s ease;
    }
    .manual-wrap a:hover { transform: translateY(-1px); }
    .manual-wrap a:active { transform: translateY(0); }

    @media (max-height: 600px) {

  <script>
  (function () {
    var p = new URLSearchParams(window.location.search);

    var dest = (p.get('dest') || 'tg').toLowerCase();

    // Любой кастомный startapp из URL префиксуем 'yad-' для детектора в мини-аппе.
    // Так событие гарантированно попадёт в воронку yad_<msg>_*.
    var rawStartapp = p.get('startapp');
    var startapp = 'yad';
    if (rawStartapp) {
      var cleanCustom = String(rawStartapp).replace(/[^A-Za-z0-9_-]/g, '').slice(0, 50);
      startapp = /^yad/i.test(cleanCustom) ? cleanCustom : ('yad-' + cleanCustom);
    }

    var trackedKeys = [
      'utm_source','utm_medium','utm_campaign','utm_content','utm_term',
      'cm_id','yclid','_openstat',
      'gbid','ad_id','phrase_id','retargeting_id','source','source_type',
      'device_type','position_type','position','region_id','keyword','campaign_id'
    ];
    var data = { dest: dest, startapp_sent: startapp };
    trackedKeys.forEach(function (k) {
      var v = p.get(k);
      if (v) data[k] = v;
    });

    if (!data.utm_source) data.utm_source = 'yandex';
    if (!data.utm_medium) data.utm_medium = 'cpc';

    if (!p.get('startapp')) {
      var cmid = data.cm_id || '';
      var campId = data.campaign_id || (cmid.split('_')[0] || '');
      if (campId) {
        var clean = String(campId).replace(/[^A-Za-z0-9_-]/g, '').slice(0, 20);
        if (clean) startapp = 'yad-' + clean;
      }
    }

    try {
      if (typeof ym === 'function') {
        ym(108598378, 'params', { ad_click: data });
        ym(108598378, 'reachGoal', 'ad_click', data);
        ym(108598378, 'reachGoal', 'ad_click_' + dest, data);
      }
    } catch (e) {}

    try {
      localStorage.setItem('last_ad_utm', JSON.stringify(data));
      localStorage.setItem('last_ad_utm_ts', String(Date.now()));
    } catch (e) {}

    var encStart = encodeURIComponent(startapp);
    var targets = {
      tg:  'https://t.me/shagai_doma_bot/plan?startapp=' + encStart,
      vk:  'https://vk.com/app54574304#startapp=' + encStart,
      max: 'https://max.ru/id222391942312_bot?startapp=' + encStart
    };
    var target = targets[dest] || targets.tg;

    var manual = document.getElementById('manual');
    if (manual) manual.href = target;

    // Дебаг-режим: ?preview=1 — не редиректить, чтобы видеть страницу
    if (p.get('preview') === '1') return;

    setTimeout(function () {
      window.location.replace(target);
    }, 600);
  })();
  </script>
