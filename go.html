  <style>
    :root {
      --red: #ce2c01;
      --red-deep: #a52301;
      --cream: #fff8ed;
      --cream-soft: rgba(255, 248, 237, 0.7);
      --cream-faint: rgba(255, 248, 237, 0.15);
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      height: 100%;
      background: var(--red);
      color: var(--cream);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow: hidden;
    }

    body {
      background:
        radial-gradient(circle at 20% 10%, rgba(255, 130, 80, 0.18) 0%, transparent 50%),
        radial-gradient(circle at 85% 90%, rgba(255, 90, 30, 0.22) 0%, transparent 55%),
        var(--red);
      display: flex; flex-direction: column;
      align-items: center; justify-content: space-between;
      padding: 32px 24px;
      text-align: center;
    }

    .top {
      width: 100%;
      display: flex; justify-content: center;
      padding-top: 16px;
    }
    .logo svg {
      height: 44px; width: auto;
      display: block;
    }

    .middle {
      flex: 1;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 28px;
      max-width: 360px;
    }

    .spinner {
      width: 56px; height: 56px;
      position: relative;
    }
    .spinner::before {
      content: '';
      position: absolute; inset: 0;
      border: 3px solid var(--cream-faint);
      border-radius: 50%;
    }
    .spinner::after {
      content: '';
      position: absolute; inset: 0;
      border: 3px solid transparent;
      border-top-color: var(--cream);
      border-right-color: var(--cream);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    h1 {
      font-family: 'Unbounded', sans-serif;
      font-weight: 700;
      font-size: 26px;
      line-height: 1.15;
      letter-spacing: -0.02em;
      margin: 0;
      color: var(--cream);
    }
    .sub {
      font-size: 15px;
      line-height: 1.5;
      color: var(--cream-soft);
      margin: 0;
    }

    .bottom {
      width: 100%;
      max-width: 360px;
      padding-bottom: 8px;
    }
    .manual-wrap {
      font-size: 13px;
      color: var(--cream-soft);
      line-height: 1.5;
    }
    .manual-wrap a {
      display: inline-block;
      margin-top: 10px;
      padding: 12px 22px;
      background: var(--cream);
      color: var(--red-deep);
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 14px;
      text-decoration: none;
      border-radius: 999px;
      transition: transform 0.15s ease, background 0.15s ease;
    }
    .manual-wrap a:hover { transform: translateY(-1px); }
    .manual-wrap a:active { transform: translateY(0); }

    @media (max-height: 600px) {
      h1 { font-size: 22px; }
      .spinner { width: 44px; height: 44px; }
      body { padding: 20px; }
    }
    @media (max-width: 360px) {
      h1 { font-size: 22px; }
    }
  </style>
</head>

    </div>

  <script>
  (function () {
    var p = new URLSearchParams(window.location.search);

    var dest = (p.get('dest') || 'tg').toLowerCase();

    // from=yad (по умолчанию) / from=seed — определяет префикс startapp.
    // Это нужно чтобы Сергей (посевы) тоже мог использовать прокладку
    // и тем самым получать ERID-маркировку и трекинг через Метрику.
    var from = (p.get('from') || 'yad').toLowerCase();
    var prefix = from === 'seed' ? 'seed-' : 'yad-';

    // Кастомный startapp из URL префиксуем правильным префиксом для детектора.
    var rawStartapp = p.get('startapp');
    var startapp = from === 'seed' ? 'seed' : 'yad';
    if (rawStartapp) {
      var cleanCustom = String(rawStartapp).replace(/[^A-Za-z0-9_-]/g, '').slice(0, 50);
      if (new RegExp('^' + prefix.slice(0, -1), 'i').test(cleanCustom)) {
        startapp = cleanCustom; // уже с правильным префиксом
      } else {
        startapp = prefix + cleanCustom;
      }
    }

    var trackedKeys = [
      'utm_source','utm_medium','utm_campaign','utm_content','utm_term',
      'cm_id','yclid','_openstat','erid',
      'gbid','ad_id','phrase_id','retargeting_id','source','source_type',
      'device_type','position_type','position','region_id','keyword','campaign_id'
    ];
    var data = { dest: dest, from: from, startapp_sent: startapp };
    trackedKeys.forEach(function (k) {
      var v = p.get(k);
      if (v) data[k] = v;
    });

    // Дефолты по источнику
    if (!data.utm_source) data.utm_source = from === 'seed' ? 'tg_seed' : 'yandex';
    if (!data.utm_medium) data.utm_medium = from === 'seed' ? 'seed' : 'cpc';

    // Если startapp не задан вручную, для yad собираем из cm_id/campaign_id
    if (!p.get('startapp') && from === 'yad') {
      var cmid = data.cm_id || '';
      var campId = data.campaign_id || (cmid.split('_')[0] || '');
      if (campId) {
        var clean = String(campId).replace(/[^A-Za-z0-9_-]/g, '').slice(0, 20);
        if (clean) startapp = 'yad-' + clean;
      }
    }

    try {
      localStorage.setItem('last_ad_utm', JSON.stringify(data));
      localStorage.setItem('last_ad_utm_ts', String(Date.now()));
    } catch (e) {}

    // ── Salebot прокси: захват UTM в переменные сделки + редирект в TG бот ──
    // Salebot ловит utm_source / utm_campaign / erid из URL прокси-ссылки,
    // сохраняет их в переменные сделки клиента, потом редиректит юзера в TG.
    // В welcome-сообщении кнопка с URL t.me/.../plan?startapp=#{utm_campaign}
    // автоматически подставляет наше значение → мини-апп получает метку для Метрики.

    // utm_campaign для Salebot: для Директа префикс "yad-", для посевов префикс "seed-"
    // или просто имя канала. Детектор в мини-аппе различит источник по префиксу.
    var sbCampaign;
    if (from === 'seed') {
      // Посев: используем имя канала (startapp) или campaign_id
      sbCampaign = rawStartapp || (data.cm_id ? data.cm_id.split('_')[0] : '') || 'seed';
    } else {
      // Я.Директ: префиксуем "yad-" + campaign_id (или кастомное слово)
      var campId = data.campaign_id || (data.cm_id ? data.cm_id.split('_')[0] : '') || rawStartapp || '';
      sbCampaign = campId ? ('yad-' + String(campId).replace(/[^A-Za-z0-9_-]/g, '').slice(0, 30)) : 'yandex';
    }

    // Собираем UTM-параметры для Salebot прокси-ссылки
    var sbParams = new URLSearchParams();
    sbParams.set('utm_source', from === 'seed' ? 'tg_seed' : 'yandex');
    sbParams.set('utm_campaign', sbCampaign);
    if (data.utm_term)    sbParams.set('utm_term', data.utm_term);
    if (data.utm_content) sbParams.set('utm_content', data.utm_content);
    if (data.erid)        sbParams.set('erid', data.erid);
    if (data.utm_medium)  sbParams.set('utm_medium', data.utm_medium);
    if (data.yclid)       sbParams.set('yclid', data.yclid);
    if (data.cm_id)       sbParams.set('cm_id', data.cm_id);

    // buildAndRedirect вызывается после получения ym_client_id.
    // ymClientId передаётся в Salebot → startapp → plan.html, где используется
    // для инициализации Метрики с тем же clientID — это связывает браузерную сессию
    // (с yclid, атрибутированную к Директу) с TMA-сессией, делая TMA-цели видимыми
    // в статистике рекламной кампании.
    function buildAndRedirect(ymClientId) {
      if (ymClientId) {
        var b64cid = btoa(String(ymClientId)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        sbParams.set('ym_cid', b64cid);
      }

      var salebotProxy = 'https://s.salebot.pro/walkwalk_1?' + sbParams.toString();

      var encStart = sbCampaign;
      var deeplinks = {
        tg:  salebotProxy,
        vk:  'vk://vk.com/app54574304#startapp=' + encStart,
        max: 'max://max.ru/id222391942312_bot?startapp=' + encStart
      };
      var webFallbacks = {
        tg:  salebotProxy,
        vk:  'https://vk.com/app54574304#startapp=' + encStart,
        max: 'https://max.ru/id222391942312_bot?startapp=' + encStart
      };
      var deeplink = deeplinks[dest] || deeplinks.tg;
      var webFallback = webFallbacks[dest] || webFallbacks.tg;

      var manual = document.getElementById('manual');
      if (manual) manual.href = webFallback;

      if (p.get('preview') === '1') return;

      var redirected = false;
      function doRedirect() {
        if (redirected) return;
        redirected = true;
        window.location.href = deeplink;
        setTimeout(function () {
          try { window.location.replace(webFallback); } catch (e) {}
        }, 1200);
      }
      try {
        if (typeof ym === 'function') {
          ym(108598378, 'params', { ad_click: data });
          ym(108598378, 'reachGoal', 'ad_click', data, doRedirect);
          ym(108598378, 'reachGoal', 'ad_click_' + dest, data);
        } else {
          setTimeout(doRedirect, 400);
        }
      } catch (e) {
        setTimeout(doRedirect, 400);
      }
      setTimeout(doRedirect, 1500);
    }

    // getClientID читает куку _ym_uid — отвечает за <50мс на инициализированном счётчике.
    // Ждём максимум 500мс, потом редиректим без ym_cid (не блокируем пользователя).
    var _cidDone = false;
    function _oncid(id) { if (!_cidDone) { _cidDone = true; buildAndRedirect(id || ''); } }
    if (typeof ym === 'function') {
      ym(108598378, 'getClientID', _oncid);
      setTimeout(function() { _oncid(''); }, 500);
    } else {
      buildAndRedirect('');
    }
  })();
  </script>
