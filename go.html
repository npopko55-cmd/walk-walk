    k=e.createElement(t),a=e.getElementsByTagName(t)[0],k.async=1,k.src=r,a.parentNode.insertBefore(k,a)})

  <style>
    html, body {
      margin: 0; padding: 0;
      background: #0f0f0f; color: #f0ece3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100%;
      display: flex; align-items: center; justify-content: center;
      text-align: center;
    }
    .box { padding: 24px; }
    .spinner {
      width: 48px; height: 48px;
      border: 3px solid rgba(240,236,227,0.2);
      border-top-color: #f0ece3;
      border-radius: 50%;
      margin: 0 auto 20px;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { font-size: 16px; font-weight: 500; margin: 0 0 8px; opacity: 0.9; }
    p  { font-size: 13px; margin: 0; opacity: 0.6; }
    a  { color: #f0ece3; text-decoration: underline; }
  </style>
</head>
<body>
  <div class="box">
    <div class="spinner"></div>
    <h1>Открываем приложение…</h1>
    <p>Если ничего не произошло — <a id="manual" href="https://t.me/shagai_doma_bot/plan?startapp=yad">нажмите сюда</a></p>
  </div>

  <script>
  (function () {
    var p = new URLSearchParams(window.location.search);

    // dest=tg|vk|max  — куда редиректим. По умолчанию tg.
    var dest = (p.get('dest') || 'tg').toLowerCase();

    // startapp — что положить в стартап мини-аппа.
    // По умолчанию 'yad' (yandex ads). Можно переопределить из URL.
    var startapp = p.get('startapp') || 'yad';

    // Собираем всё что прислал Я.Директ
    var trackedKeys = [
      'utm_source','utm_medium','utm_campaign','utm_content','utm_term',
      'cm_id','yclid','_openstat',
      'gbid','ad_id','phrase_id','retargeting_id','source','source_type',
      'device_type','position_type','position','region_id','keyword','campaign_id'
    ];
    var data = { dest: dest, startapp_sent: startapp };
    trackedKeys.forEach(function (k) {
      var v = p.get(k);
      if (v) data[k] = v;
    });

    // Если utm_source не передан, но мы пришли через эту страницу — считаем yandex
    if (!data.utm_source) data.utm_source = 'yandex';
    if (!data.utm_medium) data.utm_medium = 'cpc';

    // Делаем короткий маркер кампании для startapp (TG лимит 64 символа, [A-Za-z0-9_-]).
    // Если startapp пришёл в URL — оставляем его. Иначе пытаемся слепить из cm_id/campaign_id.
    if (!p.get('startapp')) {
      var cmid = data.cm_id || '';
      var campId = data.campaign_id || (cmid.split('_')[0] || '');
      if (campId) {
        // sanitize: только [A-Za-z0-9_-]
        var clean = String(campId).replace(/[^A-Za-z0-9_-]/g, '').slice(0, 20);
        if (clean) startapp = 'yad-' + clean;
      }
    }

    // Отдаём всё в Метрику
    try {
      if (typeof ym === 'function') {
        ym(108598378, 'params', { ad_click: data });
        ym(108598378, 'reachGoal', 'ad_click', data);
        ym(108598378, 'reachGoal', 'ad_click_' + dest, data);
      }
    } catch (e) {}

    // Кладём UTM в localStorage — если мини-апп откроет ту же страницу walk-walk.ru
    // в WebView с теми же cookies, мы их подхватим
    try {
      localStorage.setItem('last_ad_utm', JSON.stringify(data));
      localStorage.setItem('last_ad_utm_ts', String(Date.now()));
    } catch (e) {}

    // Целевые ссылки
    var encStart = encodeURIComponent(startapp);
    var targets = {
      tg:  'https://t.me/shagai_doma_bot/plan?startapp=' + encStart,
      vk:  'https://vk.com/app54574304#startapp=' + encStart,
      max: 'https://max.ru/id222391942312_bot?startapp=' + encStart
    };
    var target = targets[dest] || targets.tg;

    // Подменяем «ручную» ссылку на случай если автоматический редирект не сработал
    var manual = document.getElementById('manual');
    if (manual) {
      manual.href = target;
      manual.textContent = 'нажмите сюда';
    }

    // Даём Метрике 350мс отправить хит, потом редирект
    setTimeout(function () {
      window.location.replace(target);
    }, 350);
  })();
  </script>
</body>
</html>
